    <filter id="dsFold" x="-90%" y="-90%" width="280%" height="280%">
      <feDropShadow dx="0.5" dy="1.1" stdDeviation="0.9" flood-color="#000000" flood-opacity="0.32"/>
    </filter>
  </defs>

  <!-- SHEET: outer L5 R41 T0 B46, ~1px border, dog-ear (33,0)->(41,8) -->
  <path d="M5.6 0.6 L32.8 0.6 L40.4 8.2 L40.4 45.4 L5.6 45.4 Z"
        fill="url(#page)" stroke="#007be0" stroke-width="1.2" stroke-linejoin="round"
        filter="url(#dsPage)"/>
  <!-- folded corner (gradient), casts a small shadow onto the page below it -->
  <path d="M32.8 0.6 L40.4 8.2 L32.8 8.2 Z"
        fill="url(#flap)" stroke="#007be0" stroke-width="0.9" stroke-linejoin="round"
        filter="url(#dsFold)"/>

