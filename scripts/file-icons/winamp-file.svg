  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#edf8ff"/>
      <stop offset="1" stop-color="#c7e9ff"/>
    </linearGradient>
    <linearGradient id="flap" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#bfe0fb"/>
      <stop offset="1" stop-color="#2f7fd0"/>
    </linearGradient>
    <filter id="dsPage" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="1.5" dy="1.5" stdDeviation="0.8" flood-color="#000000" flood-opacity="0.38"/>
