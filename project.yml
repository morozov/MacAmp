name: MacAmpApp
options:
  minimumXcodeGenVersion: 2.38.0
  deploymentTarget:
    macOS: '15.0'
  xcodeVersion: '26.0'
  defaultConfig: Debug
packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    from: 0.9.0
  swift-atomics:
    url: https://github.com/apple/swift-atomics.git
    from: 1.2.0
targets:
  MacAmp:
    type: application
    platform: macOS
    deploymentTarget: '15.0'
    sources:
      - path: MacAmpApp
        excludes:
          - Info.plist
          - MacAmp.entitlements
      - path: Butterchurn
        type: folder
        buildPhase: resources
    resources:
      - path: MacAmpApp/Skins
      - path: MacAmpApp/AppIcon.icon
      - path: MacAmpApp/FileIcons
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hankyeomans.MacAmp
        INFOPLIST_FILE: MacAmpApp/Info.plist
        CODE_SIGN_ENTITLEMENTS: MacAmpApp/MacAmp.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: AC3LGVEJJ8
        SWIFT_VERSION: '6.2'
        PRODUCT_NAME: MacAmp
        ENABLE_HARDENED_RUNTIME: true
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_OBJC_BRIDGING_HEADER: MacAmpApp/MacAmpApp-Bridging-Header.h
      configs:
        Debug:
          CODE_SIGN_IDENTITY: Apple Development
        Release:
          CODE_SIGN_IDENTITY: Developer ID Application
          CONFIGURATION_BUILD_DIR: $(PROJECT_DIR)/dist
    dependencies:
      - package: ZIPFoundation
      - package: swift-atomics
        product: Atomics
    postBuildScripts:
      - name: Stamp version with commit SHA
        basedOnDependencyAnalysis: false
        script: |
          # Runs after every build phase and before code signing, so the
          # stamped bundle is the one that gets signed. A build outside a
          # git checkout keeps the placeholder from Info.plist.
          sha=$(git -C "$PROJECT_DIR" rev-parse --short HEAD 2>/dev/null) || exit 0
          [ -n "$sha" ] || exit 0
          plist="$TARGET_BUILD_DIR/$INFOPLIST_PATH"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $sha" "$plist"
  MacAmpTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/MacAmpTests
    dependencies:
      - target: MacAmp
      - package: swift-atomics
        product: Atomics
    settings:
      base:
        SWIFT_VERSION: '6.2'
        GENERATE_INFOPLIST_FILE: true
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: AC3LGVEJJ8
  MacAmpUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: Tests/MacAmpUITests
    dependencies:
      - target: MacAmp
    settings:
      base:
        SWIFT_VERSION: '6.2'
        GENERATE_INFOPLIST_FILE: true
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: AC3LGVEJJ8
        TEST_TARGET_NAME: MacAmp
schemes:
  MacAmpApp:
    build:
      targets:
        MacAmp: all
        MacAmpTests: [test]
        MacAmpUITests: [test]
    run:
      config: Debug
      environmentVariables:
        - variable: DYLD_INSERT_LIBRARIES
          value: ''
          isEnabled: false
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - MacAmpTests
        - MacAmpUITests
